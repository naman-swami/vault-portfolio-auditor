annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Calculate annualized risk-adjusted return and Sharpe/Sortino ratios.
input_schema:
  additionalProperties: false
  properties:
    portfolio_weights:
      type: string
    returns_history:
      type: string
    risk_free_rate:
      type: number
  required:
  - portfolio_weights
  - returns_history
  type: object
name: compute-sharpe-ratio
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
