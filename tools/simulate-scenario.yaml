annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Simulate portfolio impact of interest-rate hikes and equity market corrections.
input_schema:
  additionalProperties: false
  properties:
    holdings:
      type: string
    scenario_type:
      type: string
  required:
  - holdings
  - scenario_type
  type: object
name: simulate-scenario
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
