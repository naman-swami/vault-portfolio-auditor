name: Portfolio Risk Audit CI

on: [push, pull_request]

jobs:
  risk-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Sample Portfolio Schema
        run: |
          python -c "import json, math; d=json.load(open('data/sample_portfolio.json')); assert math.isclose(sum(p['weight'] for p in d['positions']), 1.0, rel_tol=1e-3); print('Portfolio verified')"
      - name: Run Quantitative Risk Tests
        run: pytest tests/ -v
      - name: Validate OpenGAP 0.1.0 Manifest
        run: |
          python -c "import yaml; d=yaml.safe_load(open('agent.yaml')); assert d['spec_version']=='0.1.0' and len(d)==5; print('OpenGAP Spec Validated')"
